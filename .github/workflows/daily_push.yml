name: 每日宏观热点推送

on:
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  daily-push:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 设置 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: pip install -r requirements.txt
        timeout-minutes: 10

      - name: 执行推送
        run: python daily_push.py
        timeout-minutes: 5
